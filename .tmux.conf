# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "tmux-256color"

# Number windows/panes from 1 and keep indices sequential after a window is closed,
# so a window's index always equals its position. This makes `M-N` select the Nth
# window and `#I` in the status bar show the position (1, 2, 3, ...) rather than a
# possibly-gapped raw index.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pass Ctrl-/ through to the pane so Neovim's <C-/> comment mapping works.
# Ghostty (kitty-protocol terminal) sends Ctrl-/ as the legacy byte 0x1f, which
# tmux labels as C-_. Re-emit it as the logical C-/ key so tmux encodes it as
# the xterm modifyOtherKeys sequence Neovim reads as <C-/>.
unbind-key -T root C-/
bind-key -T root C-_ send-keys C-/

unbind C-b
set-option -g prefix C-t
bind -n C-M-Left switch-client -p
bind -n C-M-Right switch-client -n

# Renaming a session swaps order numbers: taking a number already used by another
# session bumps that session into the number being vacated. See the script header
# in ~/.tmux-rename-session.sh.
bind-key '$' command-prompt -I "#S" -p "(rename-session)" "run-shell '/Users/lvenceslau/.tmux-rename-session.sh \"#S\" \"%%\"'"
# New window opens in the current pane's working directory
bind c new-window -c "#{pane_current_path}"

# Focus events enabled for terminals that support them
set -g focus-events on
# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Option+1..9 -> switch to the Nth window in the current session.
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Option+Arrow -> cycle windows (replaces prefix+n / prefix+p)
# bind-key -n C-Left  previous-window
# bind-key -n C-Right next-window

set -g status on

# Force a status-bar redraw whenever a session is renamed, so the session-list
# #() script in status-left re-runs immediately instead of waiting for the next
# status-interval tick. Covers both interactive prefix-$ renames (which route
# through ~/.tmux-rename-session.sh) and the swap renames that script issues.
set-hook -g session-renamed 'refresh-client -S'

# Auto-prefix new sessions with their order number "(<n>) ". The hook covers
# every creation path (prefix-C below, `tmux new -s`, tmux-resurrect restore).
# #{q:...} shell-quotes the args so names with spaces / '$' ids survive intact.
set-hook -g session-created 'run-shell "/Users/lvenceslau/.tmux-new-session-prefix.sh #{q:session_name} #{q:session_id}"'

# Create a new session: prompt for a name, then let the session-created hook
# prepend the order number. new-session (no -d) attaches the client to it.
bind-key C command-prompt -p "New session name:" "new-session -s '%%'"

# ── Status bar (doom-one colorscheme) ────────────────────────────────────────
set -g status-style          "bg=#1d2021,fg=#ebdbb2"
set -g status-position       top
set -g status-justify        absolute-centre

# Left: all sessions (active = yellow pill, others = plain yellow text, numbered to match M-1..M-9).
# The session list is rendered by ~/.tmux-session-list.sh (called via #() with the current session
# id as arg) because #{S:} exposes no per-session index; NR matches the 1-indexed `tmux list-sessions`
# order used by M-N. A script file avoids the nested-escape mangling that breaks an inline awk in #().
set -g status-left           "#(/Users/lvenceslau/.tmux-session-list.sh '#{session_id}') #[default]"
set -g status-left-length    200

# Center: window tabs. status-justify centre (above) centers this area between status-left/right.
# Inactive = plain teal text; active = teal rounded pill (same glyph/style as the session pill).
setw -g window-status-format         "#[fg=#83a598]#[bg=#1d2021] #I:#W #[default]"
setw -g window-status-current-format "#[fg=#83a598,bg=#1d2021]\ue0b6#[fg=#1d2021,bg=#83a598,bold] #I:#W #[fg=#83a598,bg=#1d2021,nobold]\ue0b4#[default]"
setw -g window-status-separator      ""

# Right: folder (blue)  >  git branch (#a0a000 when clean, #d79921 when dirty) — connected powerline segments, p10k-style
set -g status-right          "#(cd #{pane_current_path} && d=\$(basename \"\$PWD\"); b=\$(git branch --show-current 2>/dev/null); if [ -n \"\$b\" ]; then c=#d79921; [ -z \"\$(git status --porcelain 2>/dev/null)\" ] && c=#a0a000; echo \"#[fg=#458588,bg=#1d2021]\ue0b6#[fg=#e4e4e4,bg=#458588] \uf07c \$d #[fg=#458588,bg=\$c]\ue0b0#[fg=#1d2021,bg=\$c] \uf126 \$b #[fg=\$c,bg=#1d2021]\ue0b0\"; else echo \"#[fg=#458588,bg=#1d2021]\ue0b6#[fg=#e4e4e4,bg=#458588] \uf07c \$d #[fg=#458588,bg=#1d2021]\ue0b0\"; fi)#[default]"
set -g status-right-length   120
# ─────────────────────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tmux-resurrect'
